<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>只要妳幸福就好</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #000;
  color: #fff;
  font-family: "Microsoft JhengHei", "Noto Sans TC", "Source Han Sans TC", "PingFang TC", sans-serif;
  overflow: hidden;
  height: 100vh;
  width: 100vw;
  user-select: none;
}

#game {
  position: relative;
  width: 100vw;
  height: 100vh;
  background: #000;
  cursor: pointer;
  overflow: hidden;
}

/* ── 背景圖層 ── */
#bg-layer {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
  background-color: #0a0a0a;
}

/* 轉場用雙緩衝背景 */
#bg-layer2 {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
  background-color: #0a0a0a;
  opacity: 0;
  transition: opacity 1.2s ease;
}

/* 漸層暗角 overlay */
#vignette {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.5) 100%);
  pointer-events: none;
  z-index: 1;
}

/* ── 文字框 ── */
#textbox {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  min-height: 28vh;
  max-height: 50vh;
  background: linear-gradient(transparent, rgba(0,0,0,0.88) 12%, rgba(0,0,0,0.94) 95%);
  padding: 3.5vh 5vw 3.5vh;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  z-index: 3;
  transition: opacity 0.8s;
}

#speaker {
  font-size: clamp(0.95rem, 2vw, 1.5rem);
  font-weight: bold;
  margin-bottom: 0.3em;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.4s, transform 0.4s;
  letter-spacing: 0.05em;
  padding-left: 0.2em;
}

#speaker.show {
  opacity: 1;
  transform: translateY(0);
}

#dialogue {
  font-size: clamp(1.05rem, 2.6vw, 1.8rem);
  line-height: 1.8;
  text-shadow: 0 2px 12px rgba(0,0,0,0.95), 0 0 30px rgba(0,0,0,0.5);
  min-height: 1.8em;
  letter-spacing: 0.03em;
}

#dialogue .cursor {
  display: inline-block;
  width: 2px;
  height: 1.2em;
  background: rgba(255,255,255,0.8);
  margin-left: 3px;
  animation: blink 0.7s step-end infinite;
  vertical-align: text-bottom;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

/* ── 下一句指示 ── */
#next-indicator {
  position: absolute;
  bottom: 2.5vh;
  right: 4vw;
  font-size: clamp(1.1rem, 1.8vw, 1.4rem);
  color: rgba(255,255,255,0.35);
  animation: bounce 1.5s ease-in-out infinite;
  opacity: 0;
  transition: opacity 0.5s;
  z-index: 4;
}

#next-indicator.show {
  opacity: 1;
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}

/* ── 按鈕 ── */
#skip-btn {
  position: absolute;
  top: 1.5vh;
  right: 2vw;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
  color: rgba(255,255,255,0.4);
  padding: 0.3em 0.9em;
  border-radius: 3px;
  cursor: pointer;
  font-size: clamp(0.65rem, 1vw, 0.8rem);
  font-family: inherit;
  z-index: 10;
  transition: all 0.3s;
  letter-spacing: 0.05em;
}

#skip-btn:hover {
  background: rgba(255,255,255,0.15);
  color: #fff;
}

/* ── 結尾畫面 ── */
#ending {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 6;
  text-align: center;
  pointer-events: none;
  opacity: 0;
  transition: opacity 2.5s;
}

#ending.show {
  opacity: 1;
}

#ending .fin {
  font-size: clamp(2rem, 4vw, 3rem);
  letter-spacing: 0.5em;
  color: rgba(255,255,255,0.5);
  font-weight: 300;
}

#ending .sub {
  font-size: clamp(0.7rem, 1.2vw, 0.9rem);
  color: rgba(255,255,255,0.2);
  margin-top: 3em;
  letter-spacing: 0.1em;
}

/* ── 打字機進度條 (用於快轉) ── */
#progress-bar {
  position: absolute;
  top: 0;
  left: 0;
  height: 2px;
  background: linear-gradient(90deg, rgba(255,255,255,0.3), rgba(255,255,255,0.1));
  z-index: 10;
  transition: width 0.1s;
  width: 0%;
  opacity: 0;
}

#progress-bar.show {
  opacity: 1;
}

/* ── 響應式 ── */
@media (max-aspect-ratio: 4/3) {
  #textbox { min-height: 32vh; }
  #dialogue { font-size: clamp(0.95rem, 3vw, 1.4rem); }
}

@media (max-height: 500px) {
  #textbox { min-height: 45vh; padding: 2vh 4vw; }
  #dialogue { font-size: 0.85rem; line-height: 1.5; }
  #speaker { font-size: 0.75rem; }
}
</style>
</head>
<body>

<div id="game">
  <div id="bg-layer"></div>
  <div id="bg-layer2"></div>
  <div id="vignette"></div>
  <div id="progress-bar"></div>
  <div id="ending">
    <div class="fin">— Fin —</div>
    <div class="sub">只要妳幸福就好</div>
  </div>
  <div id="textbox">
    <div id="speaker"></div>
    <div id="dialogue"></div>
  </div>
  <div id="next-indicator">▼</div>
  <button id="skip-btn">▶ 跳過</button>
</div>

<script>

  { text: "那個她興奮地指著漫畫封面的瞬間。" },
  { text: "我會對她說：" },
  { text: "「我喜歡妳。」" },
  { text: "——但那年夏天已經不會回來了。" },
  { bg: null, transition: "fade" },

  // END
  { end: true }
];

// ============================================================
// 遊戲引擎
// ============================================================
const bg1 = document.getElementById('bg-layer');
const bg2 = document.getElementById('bg-layer2');
const speakerEl = document.getElementById('speaker');
const dialogueEl = document.getElementById('dialogue');

const nextIndicator = document.getElementById('next-indicator');
const skipBtn = document.getElementById('skip-btn');
const progressBar = document.getElementById('progress-bar');
const ending = document.getElementById('ending');
const textbox = document.getElementById('textbox');

let currentIndex = 0;
let isTransitioning = false;
let isTyping = false;
let typeTimer = null;
let skipMode = false;
let activeBg = null;
let activeLayer = 'bg1';

// Layer swap
function getBg(id) { return id === 'bg1' ? bg1 : bg2; }
function getInactiveBg() { return activeLayer === 'bg1' ? bg2 : bg1; }

function formatText(text) {
  let t = text.replace(/\{b\}(.*?)\{\/b\}/g, '<b>$1</b>');
  t = t.replace(/——/g, '—');
  return t;
}

function setBackground(bgKey, transition, callback) {
  const imgSrc = bgKey ? IMAGES[bgKey] : null;

  if (bgKey === activeBg) {
    if (callback) callback();
    return;
  }

  const prevBg = activeBg;
  activeBg = bgKey;

  if (!imgSrc) {
    // Clear to black
    const active = getBg(activeLayer);
    active.style.backgroundImage = 'none';
    active.style.backgroundColor = '#000';
    if (callback) callback();
    return;
  }

  // Preload
  const img = new Image();
  img.onload = () => {
    // Swap to inactive layer
    const nextLayer = activeLayer === 'bg1' ? 'bg2' : 'bg1';
    const next = getBg(nextLayer);
    const active = getBg(activeLayer);

    next.style.backgroundImage = `url(${imgSrc})`;
    next.style.backgroundColor = '#0a0a0a';
    next.style.opacity = '0';

    // Force reflow then fade
    void next.offsetWidth;

    next.style.transition = 'opacity 1.2s ease';
    next.style.opacity = '1';
    active.style.opacity = '0';

    activeLayer = nextLayer;

    setTimeout(() => {
      active.style.backgroundImage = 'none';
      if (callback) callback();
    }, 1300);
  };
  img.onerror = () => {
    if (callback) callback();
  };
  img.src = imgSrc;
}

function typeText(text, callback) {
  if (!text) {
    dialogueEl.innerHTML = '&nbsp;';
    if (callback) callback();
    return;
  }

  const formatted = formatText(text);
  let html = '';
  let i = 0;
  const chars = [...formatted];

  isTyping = true;
  nextIndicator.classList.remove('show');

  function addChar() {
    if (skipMode) {
      dialogueEl.innerHTML = formatted;
      isTyping = false;
      nextIndicator.classList.add('show');
      if (callback) callback();
      return;
    }

    if (i < chars.length) {
      html += chars[i];
      i++;
      dialogueEl.innerHTML = html + '<span class="cursor"></span>';
      const c = chars[i-1];
      const delay = (c === '，' || c === '。' || c === '！' || c === '？' || c === '…' || c === '」') ? 55 : 22;
      typeTimer = setTimeout(addChar, delay);
    } else {
      isTyping = false;
      dialogueEl.innerHTML = formatted;
      nextIndicator.classList.add('show');
      if (callback) callback();
    }
  }

  addChar();
}

function renderLine(line, callback) {
  if (line.speaker) {
    speakerEl.textContent = line.speaker;
    speakerEl.style.color = line.color || '#fff';
    speakerEl.classList.add('show');
  } else {
    speakerEl.classList.remove('show');
    speakerEl.textContent = '';
  }

  typeText(line.text || ' ', () => {
    if (callback) callback();
  });
}

function showLine(line, callback) {
  if (isTransitioning) return;
  isTransitioning = true;

  if (typeTimer) {
    clearTimeout(typeTimer);
    typeTimer = null;
  }
  isTyping = false;

  const advance = () => {
    isTransitioning = false;
    if (callback) callback();
  };

  // End
  if (line.end) {
    textbox.style.opacity = '0';
    nextIndicator.classList.remove('show');
    setTimeout(() => ending.classList.add('show'), 800);
    return;
  }

// Background change
  if (line.bg !== undefined) {
    const trans = line.transition || 'fade';
    setBackground(line.bg, trans, () => {
      if (line.text !== undefined || line.speaker !== undefined) {
        renderLine(line, advance);
      } else {
        advance();
      }
    });
    if (line.text === undefined && line.speaker === undefined) return;
    return;
  }

  // Normal text/dialogue
  renderLine(line, advance);
}

function nextLine() {
  if (isTyping) {
    skipMode = true;
    return;
  }

  if (isTransitioning) return;
  skipMode = false;

  if (currentIndex >= story.length) return;

  // Update progress
  const pct = (currentIndex / story.length) * 100;
  progressBar.style.width = pct + '%';
  progressBar.classList.add('show');

  const line = story[currentIndex];
  currentIndex++;

  showLine(line, () => {});
}

// ── 事件綁定 ──
document.getElementById('game').addEventListener('click', nextLine);

document.addEventListener('keydown', (e) => {
  if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    e.preventDefault();
    nextLine();
  }
  if (e.key === 'Escape' && ending.classList.contains('show')) {
    // Restart
    location.reload();
  }
});

// ── 跳過按鈕 ──
skipBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  skipMode = true;

  function fastForward() {
    const total = story.length;
    while (currentIndex < total) {
      const line = story[currentIndex];
      if (line.bg) {
        activeBg = line.bg;
        const img = IMAGES[line.bg];
        if (img) {
          getBg('bg1').style.backgroundImage = `url(${img})`;
        }
      }
      currentIndex++;
    }
    progressBar.style.width = '100%';
    textbox.style.opacity = '0';
    nextIndicator.classList.remove('show');
    setTimeout(() => ending.classList.add('show'), 800);
  }

  fastForward();
});

// ── 啟動 ──
function init() {
  currentIndex = 0;
  activeLayer = 'bg1';
  activeBg = null;
  bg1.style.backgroundImage = 'none';
  bg1.style.backgroundColor = '#000';
  bg2.style.backgroundImage = 'none';
  bg2.style.backgroundColor = '#000';
  nextLine();
}

init();
</script>
</body>
</html>
